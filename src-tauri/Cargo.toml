[package]
name = "dyeai"
version = "0.0.0"
description = "DyeAI — textile job-work challan & billing manager"
authors = ["Raavi Synapse"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dyeai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
nanoid = "0.4"
chrono = "0.4"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
